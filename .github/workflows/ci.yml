name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run gate

  playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aviso si no hay specs (harness pendiente en T-05)
        if: hashFiles('tests/**/*.spec.ts') == ''
        run: echo "No hay tests/e2e/*.spec.ts todavía; el harness de Playwright llega en T-05."
      - uses: actions/setup-node@v4
        if: hashFiles('tests/**/*.spec.ts') != ''
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        if: hashFiles('tests/**/*.spec.ts') != ''
      - run: npx playwright install --with-deps chromium
        if: hashFiles('tests/**/*.spec.ts') != ''
      - run: npx playwright test
        if: hashFiles('tests/**/*.spec.ts') != ''
